name: daily

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma separated country codes (empty = all from config)"
        required: false
        default: ""
      days:
        description: "Re-download the last N days"
        required: false
        default: "5"
      from:
        description: "Backfill start YYYY-MM-DD (optional, overrides days)"
        required: false
        default: ""
      to:
        description: "Backfill end YYYY-MM-DD (optional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch
        id: fetch
        # a failing country must not block the build and deployment
        continue-on-error: true
        env:
          COUNTRIES: ${{ inputs.countries }}
          DAYS: ${{ inputs.days }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          args=()
          [ -n "$COUNTRIES" ] && args+=(--countries "$COUNTRIES")
          if [ -n "$FROM" ]; then
            args+=(--from "$FROM" --chunk-months 3)
            [ -n "$TO" ] && args+=(--to "$TO")
          else
            args+=(--days "${DAYS:-5}")
          fi
          python pipeline/fetch.py "${args[@]}"

      - name: Warn about fetch failures
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::Some downloads failed - see the Fetch step summary. Continuing with the data we have."

      - name: Fetch world (Ember)
        # 6 bulk requests, ~30 MB, ~20 s. Needs the repository secret EMBER_API_KEY
        # (free key: https://ember-energy.org/data/api/); skipped without it.
        continue-on-error: true
        env:
          EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
        run: |
          if [ -z "$EMBER_API_KEY" ]; then
            echo "::warning::Secret EMBER_API_KEY is not set - world data not updated."
            echo "### ⚠️ World data skipped - add the EMBER_API_KEY secret" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python pipeline/fetch_world.py

      - name: Build
        run: python pipeline/build.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "### ✅ Already up to date - nothing to commit" >> "$GITHUB_STEP_SUMMARY"
          else
            n=$(git diff --cached --name-only | wc -l)
            git commit -m "data: update $(date -u +%F)"
            git push
            echo "### 🔄 Data updated - $n file(s) committed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish SQLite to release 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 -k -f build/energy.sqlite
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest data (SQLite)" \
              --notes "build/energy.sqlite rebuilt daily from data/raw. Data: energy-charts.info (Fraunhofer ISE), originally ENTSO-E, CC BY 4.0; world tables: Ember, CC BY 4.0."
          gh release upload latest build/energy.sqlite.gz --clobber

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
